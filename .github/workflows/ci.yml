name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the required libsekka version
        id: sekka
        run: echo "version=$(bin/sekka_version.sh)" >> "${GITHUB_OUTPUT}"

      - name: Check out libsekka
        uses: actions/checkout@v4
        with:
          repository: YuSabo90002/libsekka
          ref: v${{ steps.sekka.outputs.version }}
          path: libsekka

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-c
        run: cargo install cargo-c --locked

      - name: Build and install libsekka
        working-directory: libsekka
        run: |
          # cinstall as the normal user into a staging dir, then copy it in as root.
          # `sudo cargo` does not work: sudo resolves the command before the PATH
          # assignment applies, so it never finds the toolchain in ~/.cargo/bin.
          cargo cinstall --release --prefix=/usr --libdir=lib/x86_64-linux-gnu \
            --destdir="${RUNNER_TEMP}/libsekka-stage"
          sudo cp -a "${RUNNER_TEMP}/libsekka-stage/usr/." /usr/
          pkg-config --modversion sekka

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake extra-cmake-modules gettext pkg-config \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtest-dev

      - name: Configure
        run: cmake -S . -B build -DENABLE_TEST=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
