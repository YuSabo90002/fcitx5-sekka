name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build and test (Arch Linux)
    # Arch is used rather than Ubuntu because this addon needs fcitx5 >= 5.1.13 (the
    # StandardPaths API; FCITX_ADDON_FACTORY_V2 needs 5.1.12), and Ubuntu 24.04 ships 5.1.2.
    # fcitx5-cskk keeps an Arch job for the same kind of reason.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            base-devel cmake extra-cmake-modules fcitx5 gtest gettext git rust cargo-c pkgconf

      - uses: actions/checkout@v4

      - name: Read the required libsekka version
        id: sekka
        run: echo "version=$(bin/sekka_version.sh)" >> "${GITHUB_OUTPUT}"

      - name: Check out libsekka
        uses: actions/checkout@v4
        with:
          repository: YuSabo90002/libsekka
          ref: v${{ steps.sekka.outputs.version }}
          path: libsekka

      - name: Build and install libsekka
        working-directory: libsekka
        run: |
          # Running as root inside the container, so this installs straight into /usr.
          cargo cinstall --release --prefix=/usr --libdir=lib
          pkg-config --modversion sekka

      - name: Configure
        run: cmake -S . -B build -DENABLE_TEST=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        # The container runs as root, and for root access(W_OK) always succeeds, so CR-01 would
        # refuse even the read-only (0444) test dictionaries. Run the tests as a regular user.
        run: |
          useradd -m tester
          chown -R tester: .
          runuser -u tester -- env HOME=/home/tester ctest --output-on-failure
